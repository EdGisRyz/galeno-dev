name: Tests CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]   # features → develop

jobs:
  test-java:
    name: Tests Spring Boot (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"              # cachea dependencias entre runs: CI más rápido

      - name: Run tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean test -B

  test-frontend:
    name: Build Frontend (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6  # @v6
        with:
          package_json_file: frontend/package.json
    
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install + typecheck + build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build