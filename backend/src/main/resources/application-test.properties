# =====================================================
# Perfil test — CI y local SIN PostgreSQL
# Se activa con @ActiveProfiles("test") en la clase de test
# Regla: solo sobrescribe lo que difiere; el resto se hereda
# =====================================================

# H2 en memoria en lugar de PostgreSQL
spring.datasource.url=jdbc:h2:mem:galeno_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway apagado: aún no hay migraciones reales
spring.flyway.enabled=false

# Menos ruido en la salida de tests
spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO