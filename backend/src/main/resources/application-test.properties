# =====================================================
# Perfil test — CI y local SIN PostgreSQL
# Se activa con @ActiveProfiles("test") en la clase de test
# Regla: solo sobrescribe lo que difiere; el resto se hereda
# =====================================================

# H2 en memoria en lugar de PostgreSQL
#spring.datasource.url=jdbc:h2:mem:galeno_test;DB_CLOSE_DELAY=-1
spring.datasource.url=jdbc:h2:mem:galeno_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway activado explícitamente: aplica la migración V1 (db/migration)
# también en test; el esquema lo crea Flyway, no Hibernate.
spring.flyway.enabled=true

# Hibernate solo valida el esquema existente; no crea ni borra tablas.
spring.jpa.hibernate.ddl-auto=validate

# Menos ruido en la salida de tests
spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO

spring.jpa.open-in-view=false