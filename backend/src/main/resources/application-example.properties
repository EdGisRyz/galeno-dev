spring.application.name=galeno-backend

# ===============================
# Conexión a PostgreSQL
# ===============================

# Cambia localhost si tu base de datos está en otro servidor
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/galeno_clinica}

# Usuario de PostgreSQL
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:TU_USUARIO_AQUI}

# Contraseña de PostgreSQL
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:TU_PASSWORD_AQUI}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# No Aplica al ser una BD nueva
# spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
logging.level.org.flywaydb=DEBUG

# ===============================
# Seguridad JWT RS256
# ===============================
# Clave pública para validar tokens del AuthService de InToGlobe
# Puede venir de variable de entorno AUTH_PUBLIC_KEY o definirse directamente aquí
# Para generar: openssl genrsa -out test-private.pem 2048
#               openssl rsa -in test-private.pem -pubout -out test-public.pem
auth.public.key=${AUTH_PUBLIC_KEY:}

# ===============================
# Microservicios (WireMock Local para Desarrollo)
# ===============================
# Puertos definidos
auth.service.url=${AUTH_SERVICE_URL:http://localhost:4001}
notif.service.url=${NOTIF_SERVICE_URL:http://localhost:4002}
storage.service.url=${STORAGE_SERVICE_URL:http://localhost:4003}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:4004}
audit.service.url=${AUDIT_SERVICE_URL:http://localhost:4005}