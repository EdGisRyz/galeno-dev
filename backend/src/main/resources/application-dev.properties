# =====================================================
# Perfil `dev` — desarrollo local
# =====================================================
# Único lugar donde se vuelve a encender la documentación de la API. La línea base
# (application.yml) la apaga en todos los perfiles, de modo que producción no la publica
# por olvido: para verla hay que activar este perfil explícitamente
# (`--spring.profiles.active=dev` o `SPRING_PROFILES_ACTIVE=dev`).
#
# La consola de H2 no se enciende aquí: el proyecto usa PostgreSQL en desarrollo y la
# dependencia de la consola tiene alcance test, así que no existe en la aplicación.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
