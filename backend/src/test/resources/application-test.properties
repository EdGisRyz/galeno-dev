# =====================================================
# Perfil test — CI y local SIN PostgreSQL
# Se activa con @ActiveProfiles("test") en la clase de test
# Regla: solo sobrescribe lo que difiere; el resto se hereda
# =====================================================

# H2 en memoria en lugar de PostgreSQL
#spring.datasource.url=jdbc:h2:mem:galeno_test;DB_CLOSE_DELAY=-1
spring.datasource.url=jdbc:h2:mem:galeno_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway activado explícitamente: aplica la migración V1 (db/migration)
# también en test; el esquema lo crea Flyway, no Hibernate.
spring.flyway.enabled=true

# Hibernate solo valida el esquema existente; no crea ni borra tablas.
spring.jpa.hibernate.ddl-auto=validate

# Menos ruido en la salida de tests
spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO

spring.jpa.open-in-view=false

# =====================================================
# Usuario en memoria de Spring Boot — excluido también en test
# =====================================================
# BackendApplication excluye UserDetailsServiceAutoConfiguration para que el arranque no
# publique una contraseña generada en el log (R-SEG-09, ADR-014). Las rebanadas de prueba
# (@WebMvcTest) no heredan el atributo exclude de la clase principal, así que la exclusión
# se repite aquí por propiedad: sin esto, cada slice seguiría escribiendo
# "Using generated security password" en el log de la suite.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# =====================================================
# Clave pública RSA de PRUEBA — NO ES UN SECRETO
# =====================================================
# Clave pública, no privada: no sirve para firmar nada, solo para que los contextos
# de prueba puedan arrancar ahora que la comprobación de arranque de la clave
# pública (R-SEG-09, AuthKeyStartupConfig) corre en TODOS los perfiles, incluido
# test. Sin este valor, y sin la variable AUTH_PUBLIC_KEY exportada, cualquier
# @SpringBootTest/@DataJpaTest del perfil test moriría en el arranque.
#
# Se ignora en cualquier contexto que valide firmas: esas pruebas generan su propio
# par RSA en memoria y sobrescriben auth.public.key con @DynamicPropertySource, que
# tiene precedencia sobre este archivo.
#
# Formato: Base64 del DER SubjectPublicKeyInfo (SPKI) en UNA línea (392 caracteres
# para RSA 2048). La mitad privada de este par se descartó al generarlo.
auth.public.